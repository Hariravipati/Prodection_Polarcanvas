<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Hummingbird body and head -->
  <ellipse cx="100" cy="80" rx="12" ry="16" fill="#FF6B35"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="10" fill="#FF6B35"/>
  
  <!-- Beak -->
  <path d="M 108 58 Q 125 55 135 58" stroke="#FF6B35" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Eye -->
  <circle cx="105" cy="58" r="2" fill="black"/>
  
  <!-- Left wing (Magenta/Pink) -->
  <path d="M 92 75 Q 70 55 65 45 Q 68 60 75 75 Q 85 85 92 80" fill="#E91E63"/>
  
  <!-- Center wing (Green) -->
  <path d="M 100 70 Q 95 45 105 30 Q 115 50 115 75 Q 110 85 100 80" fill="#00AA44"/>
  
  <!-- Right wing (Blue) -->
  <path d="M 108 75 Q 130 50 140 35 Q 135 60 120 80 Q 112 85 108 80" fill="#2196F3"/>
  
  <!-- Bottom left feather (Yellow/Orange) -->
  <path d="M 90 85 Q 75 105 70 125 Q 80 110 95 95" fill="#FFC107"/>
  
  <!-- Bottom right feather (Yellow) -->
  <path d="M 110 90 Q 125 110 130 130 Q 120 110 110 95" fill="#FFD54F"/>
  
  <!-- Tail curve -->
  <path d="M 95 95 Q 80 120 85 145 Q 90 135 100 115" stroke="#2196F3" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>